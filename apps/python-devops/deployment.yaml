apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-devops-api
  namespace: python-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-devops-api
  template:
    metadata:
      labels:
        app: python-devops-api
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret
      containers:
        - name: python-devops-api
          image: 10.0.1.212:8083/python-devops-api:5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
